[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"
[project]
name = "marcel-arch"
version = "1.0.0"
description = "Enterprise multi-agent financial governance and workflow orchestration
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Marcel Arch Engineering" }]
dependencies = [
"fastapi==0.115.8",
"uvicorn[standard]==0.34.0",
"pydantic==2.10.6",
"pydantic-settings==2.7.1",
"SQLAlchemy[asyncio]==2.0.38",
"aiosqlite==0.21.0",
"asyncpg==0.30.0",
"redis==5.2.1",
"structlog==25.1.0",
"cryptography==44.0.1",
"PyJWT==2.10.1",
"PyYAML==6.0.2",
]
[tool.setuptools]
packages = ["marcel", "marcel.api", "marcel.core", "marcel.models", "marcel.security"
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
